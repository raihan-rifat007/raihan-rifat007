<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="240" viewBox="0 0 1000 240" fill="none" role="img" aria-labelledby="t d">
  <title id="t">Raihan Ahmed</title>
  <desc id="d">Raihan Ahmed · Full Stack Developer, Linux Enthusiast, Problem Solver, Open Source Contributor</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#426fb6"/>
