      <animateTransform attributeName="transform" type="translate" values="0 0;40 -24;0 0" dur="18s" repeatCount="indefinite"/>
    </circle>
    <text x="620" y="178" font-size="170" font-weight="800" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#ffffff" fill-opacity="0.1">&lt;/&gt;</text>
  </g>
  <text x="60" y="108" font-size="54" font-weight="800" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" fill="#ffffff" letter-spacing="-1">Raihan Ahmed</text>
  <text x="60" y="158" font-size="22" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#ffffff" opacity="1">&gt; Full Stack Developer<animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.22;0.25;1" dur="12s" repeatCount="indefinite"/></text>
