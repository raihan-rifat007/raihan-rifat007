name: CI

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - config/**
      - templates/**
      - scripts/**
      - test/**
      - package.json

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate config and template
        run: npm run check

      - name: Run tests
        run: npm test

      - name: Render an offline preview
        run: npm run preview
